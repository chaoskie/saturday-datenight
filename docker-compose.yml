services:
  datenight:
    build: .
    ports:
      - "5000:5000"
    environment:
      PLANNER_PASSCODE: ${PLANNER_PASSCODE:?set a passcode}
      SECRET_KEY: ${SECRET_KEY:?set a random secret}
      AUTO_REVEAL_HOURS: ${AUTO_REVEAL_HOURS:-24}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      COMMIT_SHA: ${GIT_REV:-dev}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      ENVIRONMENT: ${ENVIRONMENT:-live}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      EXPIRY_WARNING_DAYS: ${EXPIRY_WARNING_DAYS:-14}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
